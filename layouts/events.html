{{ define "main" }} {{ partial "header" "Events" }}

<main>
  <div>
    <form id="search">
      <input
        id="query"
        type="text"
        name="query"
        placeholder="Search by title, description, location, tags, and more..."
      />
      <input
        type="submit"
        value="Search"
        class="button bg-(--legacy-color-green-35) text-white"
      />
    </form>
  </div>
  <div>
    <a href="{{ absURL "/event/new" }}">New Event</a>
  </div>
</main>

{{ end }}
