{{/* A single input text box. */}}
{{ $type := default "text" .Type }}


<input
  id="{{ .Id }}"
  type="{{ $type | safe.HTMLAttr }}"
  class="{{ .Class }} border-b-3 border-(--legacy-color-warm-gray-80) outline-none! focus:border-(--legacy-color-brown-40) border-b leading-none transition-colors duration-200 ease-in-out disabled:rounded-sm disabled:bg-gray-300 disabled:text-gray-500"
  placeholder="{{ .Placeholder }}"
/>
