{{/* A single input text box. */}}
<input
  id="{{ .Id }}"
  type="text"
  name="{{ .Name }}"
  class="{{ .Class }} border-b border-b-3 border-(--legacy-color-warm-gray-80) transition-colors duration-200 ease-in-out outline-none! focus:border-(--legacy-color-brown-40)"
  placeholder="{{ .Placeholder }}"
/>
